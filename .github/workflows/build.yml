name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libgtk-3-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build (release)
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: Test
        run: cargo test --release --manifest-path rust/Cargo.toml -p omenrgb-core

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omenrgb-linux
          path: |
            rust/target/release/omenrgb
            rust/target/release/omenrgbd
            rust/target/release/omenrgb-gui

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rust/target/release/omenrgb
            rust/target/release/omenrgbd
            rust/target/release/omenrgb-gui
