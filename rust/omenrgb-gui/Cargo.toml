[package]
name = "omenrgb-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "omenrgb-gui"
path = "src/main.rs"

[dependencies]
omenrgb-core = { path = "../omenrgb-core" }
# Wayland 原生"隐藏"= 销毁窗口 surface。主窗口用子视口实现：
# 关闭=销毁视口（真隐藏），托盘"显示"=重建视口，无需 X11 后端。
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
gif = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
async-io = "2"
zbus = "5"
