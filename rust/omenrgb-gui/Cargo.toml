[package]
name = "omenrgb-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "omenrgb-gui"
path = "src/main.rs"

[dependencies]
omenrgb-core = { path = "../omenrgb-core" }
# Wayland 协议不支持真正隐藏窗口（winit 限制，GTK/Slint/iced 同理）。
# 强制 x11 后端（XWayland），让"隐藏到托盘"真正生效。
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "web_screen_reader"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
gif = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
async-io = "2"
